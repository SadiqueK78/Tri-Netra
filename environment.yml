# ============================================================================
# TriNetra-AMRF — Conda Environment Specification
# ============================================================================
# Create:   conda env create -f environment.yml
# Activate: conda activate trinetra
# Update:   conda env update -f environment.yml --prune
# ============================================================================

name: trinetra

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # ── Python Runtime ────────────────────────────────────────────────────────
  - python=3.11

  # ── CUDA Toolkit (for GPU acceleration) ───────────────────────────────────
  - cuda-toolkit=12.1

  # ── Core Deep Learning ────────────────────────────────────────────────────
  - pytorch>=2.2.0
  - torchvision>=0.17.0
  - pytorch-cuda=12.1

  # ── Scientific Computing ──────────────────────────────────────────────────
  - numpy>=1.26.0
  - scipy>=1.12.0
  - pandas>=2.2.0

  # ── Image Processing ──────────────────────────────────────────────────────
  - opencv>=4.9.0
  - pillow>=10.2.0
  - scikit-image>=0.22.0

  # ── Visualization ─────────────────────────────────────────────────────────
  - matplotlib>=3.8.0
  - plotly>=5.18.0
  - tensorboard>=2.16.0

  # ── Evaluation ─────────────────────────────────────────────────────────────
  - scikit-learn>=1.4.0
  - pycocotools>=2.0.7

  # ── Configuration ──────────────────────────────────────────────────────────
  - pyyaml>=6.0.1

  # ── Pip-only packages ─────────────────────────────────────────────────────
  - pip
  - pip:
      - torchmetrics>=1.3.0
      - albumentations>=1.4.0
      - ultralytics>=8.1.0
      # - mmdet>=3.3.0            # MMDetection — uncomment if needed (heavy)
      # - mmengine>=0.10.0        # Required by MMDetection
      - deep-sort-realtime>=1.3.2
      - fastapi>=0.109.0
      - uvicorn[standard]>=0.27.0
      - onnxruntime-gpu>=1.17.0
      # - tensorrt>=10.0.0        # Uncomment if NVIDIA TensorRT SDK installed
      - GPUtil>=1.4.0
      - pynvml>=11.5.0
      - python-dotenv>=1.0.0
